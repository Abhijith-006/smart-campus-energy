
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-energy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-energy
  template:
    metadata:
      labels:
        app: campus-energy
    spec:
      containers:
        - name: campus-energy
          image: abhijith006/smart-campus-energy:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: campus-energy-service
spec:
  type: ClusterIP
  selector:
    app: campus-energy
  ports:
    - port: 80
      targetPort: 80
